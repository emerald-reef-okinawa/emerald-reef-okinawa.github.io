<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ご参加の確認 | エメラルドリーフ沖縄</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Antique&display=swap" rel="stylesheet">
  <!--
    前日リマインドメールの「参加を確認する」ボタンの行き先。
    このページが裏で Apps Script のウェブアプリ（EXEC_URL）を呼び、カレンダーの予定を「確認済み」にする。
    ・Apps Script を新しくデプロイして URL が変わったら、下の EXEC_URL を書き換えるだけでよい
      （送信済みのメールのボタンもそのまま使える）。
    ・Google のログイン情報は送らない（credentials: 'omit'）ので、複数アカウントで
      ログインしているお客様でも開ける。
  -->
  <style>
    :root {
      --g-dark: #005F52; --g-main: #007A6E; --g-mid: #00C9A7; --g-light: #48CAE4;
      --navy: #003D35; --bg: #FFF8F0; --text: #1a3530; --text-soft: #35564e; --err: #B4452F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100svh;
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      color: var(--text); background: var(--bg);
      display: flex; flex-direction: column; align-items: center;
      padding: 0 16px 40px;
    }
    header {
      width: calc(100% + 32px); margin: 0 -16px; padding: 14px 16px;
      background: var(--navy); display: flex; justify-content: center; align-items: center; gap: 12px;
    }
    header img { height: 38px; width: 38px; border-radius: 50%; background: #fff; }
    header span { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: .14em; color: #fff; font-size: .9rem; }
    main {
      width: 100%; max-width: 460px; margin-top: 9vh;
      background: #fff; border-radius: 16px; padding: 40px 26px 34px;
      box-shadow: 0 8px 32px rgba(0,90,80,.12); text-align: center;
    }
    .icon { width: 64px; height: 64px; margin: 0 auto 18px; }
    .icon svg { width: 100%; height: 100%; }
    h1 {
      font-family: 'Zen Antique', 'Hiragino Mincho ProN', serif; font-weight: 400;
      font-size: 1.45rem; letter-spacing: .04em; line-height: 1.5; color: var(--navy); margin-bottom: 14px;
    }
    p.msg { font-size: .92rem; line-height: 1.95; color: var(--text-soft); }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      height: 50px; border-radius: 4px; text-decoration: none;
      font-weight: 700; font-size: .9rem; letter-spacing: .06em;
    }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .btn-line { background: #06C755; color: #fff; }
    .btn-wa   { background: #25D366; color: #fff; }
    .btn-tel  { background: #fff; color: var(--g-dark); border: 1px solid rgba(0,95,82,.35); }
    .btn-site { background: var(--g-dark); color: #fff; font-family: 'Cinzel', serif; letter-spacing: .16em; font-size: .78rem; }
    .spinner {
      width: 44px; height: 44px; margin: 6px auto 22px; border-radius: 50%;
      border: 3px solid rgba(0,122,110,.18); border-top-color: var(--g-main);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
    footer { margin-top: 28px; font-size: .75rem; color: #7a8f8a; text-align: center; line-height: 1.8; }
  </style>
</head>
<body>
  <header>
    <img src="favicon-192.png" alt="" />
    <span>EMERALD REEF OKINAWA</span>
  </header>

  <main>
    <!-- 確認中 -->
    <section id="st-loading">
      <div class="spinner"></div>
      <h1 data-t="loadTtl">ご参加を確認しています</h1>
      <p class="msg" data-t="loadMsg">少々お待ちください…</p>
    </section>

    <!-- 確認できた／確認済み -->
    <section id="st-ok" hidden>
      <div class="icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#E0FAF6"/><path d="M19 33.5l9 9 17-19" fill="none" stroke="#007A6E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 id="ok-ttl"></h1>
      <p class="msg" id="ok-msg"></p>
      <div class="actions">
        <a class="btn btn-site" href="https://emerald-reef-okinawa.com/" data-t="site">EMERALD REEF OKINAWA</a>
      </div>
    </section>

    <!-- 確認できなかった -->
    <section id="st-error" hidden>
      <div class="icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#FCEDE9"/><path d="M32 18v18" stroke="#B4452F" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="45" r="3" fill="#B4452F"/></svg></div>
      <h1 data-t="errTtl">確認を受け付けられませんでした</h1>
      <p class="msg" data-t="errMsg">お手数ですが、下のいずれかで「確認しました」とお知らせください。メールへのご返信でも大丈夫です。</p>
      <div class="actions">
        <a class="btn btn-line" href="https://lin.ee/Utszl3P" target="_blank" rel="noopener">
          <svg viewBox="0 0 48 48"><path d="M24 6C13.5 6 5 13.5 5 22.6c0 6.4 4 11.9 10 15.1-.4 1.6-1.4 5.4-1.6 6.3-.2 1 .4 1 .8.8l7.9-5.3c.9.1 1.8.2 2.8.2 10.5 0 19-7.5 19-16.6C43 13.5 34.5 6 24 6z" fill="#fff"/></svg>
          <span data-t="line">LINEで連絡する</span>
        </a>
        <a class="btn btn-wa" href="https://wa.me/817085168826" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M.057 24l1.687-6.163A11.867 11.867 0 01.157 11.89C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
          <span data-t="wa">WhatsAppで連絡する</span>
        </a>
        <a class="btn btn-tel" href="tel:+817085168826"><span data-t="tel">電話する（070-8516-8826）</span></a>
      </div>
    </section>
  </main>

  <footer>エメラルドリーフ沖縄 / EMERALD REEF OKINAWA</footer>

  <script>
    /* ▼ Apps Script のウェブアプリ URL（デプロイ時に表示される /exec で終わる URL） */
    var EXEC_URL = '';

    var TEXT = {
      ja: {
        title: 'ご参加の確認 | エメラルドリーフ沖縄',
        loadTtl: 'ご参加を確認しています', loadMsg: '少々お待ちください…',
        okTtl: 'ご確認ありがとうございます',
        okMsg: '明日お会いできるのを楽しみにしております。<br>集合時間・場所は、お送りしたメールをご確認ください。',
        alreadyTtl: 'すでに確認済みです',
        alreadyMsg: 'ご参加の確認は受け付け済みです。<br>明日お会いできるのを楽しみにしております。',
        errTtl: '確認を受け付けられませんでした',
        errMsg: 'お手数ですが、下のいずれかで「確認しました」とお知らせください。メールへのご返信でも大丈夫です。',
        line: 'LINEで連絡する', wa: 'WhatsAppで連絡する', tel: '電話する（070-8516-8826）',
        site: 'EMERALD REEF OKINAWA'
      },
      en: {
        title: 'Confirm your tour | EMERALD REEF OKINAWA',
        loadTtl: 'Confirming your booking', loadMsg: 'Just a moment…',
        okTtl: 'Thank you for confirming',
        okMsg: 'We look forward to seeing you tomorrow!<br>Please check our email for the pickup time and place.',
        alreadyTtl: 'Already confirmed',
        alreadyMsg: 'Your attendance has already been confirmed.<br>See you tomorrow!',
        errTtl: 'We couldn’t confirm your booking',
        errMsg: 'Sorry about that. Please let us know you’re coming using one of the options below — a reply to our email works too.',
        line: 'Message us on LINE', wa: 'Message us on WhatsApp', tel: 'Call +81 70-8516-8826',
        site: 'EMERALD REEF OKINAWA'
      }
    };

    var q = new URLSearchParams(location.search);
    var id = q.get('id') || '';
    var token = q.get('t') || '';
    var lang = q.get('l') === 'en' ? 'en' : 'ja';
    var T = TEXT[lang];

    document.documentElement.lang = lang;
    document.title = T.title;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      if (T[el.dataset.t] !== undefined) el.innerHTML = T[el.dataset.t];
    });

    function show(status) {
      document.getElementById('st-loading').hidden = true;
      if (status === 'ok' || status === 'already') {
        document.getElementById('ok-ttl').innerHTML = status === 'ok' ? T.okTtl : T.alreadyTtl;
        document.getElementById('ok-msg').innerHTML = status === 'ok' ? T.okMsg : T.alreadyMsg;
        document.getElementById('st-ok').hidden = false;
      } else {
        document.getElementById('st-error').hidden = false;
      }
    }

    if (!id || !token || !EXEC_URL) {
      show('error');
    } else {
      var url = EXEC_URL + '?format=json'
        + '&id=' + encodeURIComponent(id)
        + '&t=' + encodeURIComponent(token)
        + '&l=' + lang;
      /* Apps Script は初回の起動に数秒かかることがあるので、長めに待つ */
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);
      fetch(url, { credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.json(); })
        .then(function (d) { clearTimeout(timer); show(d && d.status); })
        .catch(function () { clearTimeout(timer); show('error'); });
    }
  </script>
</body>
</html>
